<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e1b25">
  <title>贴云飞行 · 云际街机</title>
  <link rel="icon" href="wing.svg" type="image/svg+xml">
  <link rel="stylesheet" href="cabinet.css">
  <script defer src="scenery.js"></script>
  <script defer src="sprites.js"></script>
  <script defer src="flight.js"></script>
  <script defer src="cabinet.js"></script>
</head>
<body>
  <header class="mast"><div class="mast-inner">
    <div class="brand"><img src="wing.svg" alt="" width="55" height="39"><div><strong>云际街机</strong><span class="pixel">SKY ARCADE</span></div></div>
    <div class="header-tools">
      <button class="tool" id="sound" aria-label="关闭音效" aria-pressed="true"><i data-icon="sound"></i><span id="soundLabel">音效开</span></button>
      <button class="tool" id="full" aria-label="进入全屏"><i data-icon="full"></i><span id="fullLabel">全屏</span></button>
    </div>
  </div></header>
  <main>
    <section class="cabinet" aria-label="贴云飞行游戏机">
      <div class="stage-bar">
        <div class="stage-id"><span class="stripes" aria-hidden="true"></span><span class="pixel stage-label">STAGE 01</span><span class="bar-line"></span><strong>珊瑚海岸</strong></div>
        <div class="timer"><i data-icon="clock"></i><span class="pixel" id="remaining">01:00</span><button id="pause" hidden aria-label="暂停飞行"><i data-icon="pause"></i></button><button id="leaveFull" hidden aria-label="退出全屏"><i data-icon="full"></i></button></div>
      </div>
      <div class="stage" id="stage" data-mode="menu">
        <canvas id="flightCanvas" tabindex="0" aria-label="飞行区域，方向键或 WASD 移动，手机可单指拖动"></canvas>
        <div class="menu-shade"></div>
        <div class="reticle tl"></div><div class="reticle tr"></div><div class="reticle bl"></div><div class="reticle br"></div>
        <div class="hero" id="hero">
          <h1><img src="title.png" alt="贴云飞行" width="155" height="41"></h1>
          <div class="game-name pixel"><span aria-hidden="true"></span>CLOUD SKIMMER</div>
          <p>掠过群岛，穿越弹幕。<br>在这片海岸上空坚持 60 秒。</p>
          <div class="launch-row"><button class="launch" id="launch"><i data-icon="play"></i>开始飞行</button><kbd class="enter">ENTER</kbd></div>
        </div>
        <div class="result" id="result" hidden>
          <div class="result-card"><span class="result-mark" aria-hidden="true"><i data-icon="wing"></i></span><h2 id="resultTitle" aria-live="polite"></h2><p id="resultDetail"></p>
            <button class="launch" id="primary"><i data-icon="play"></i><span></span></button>
            <button class="text-button" id="back">返回标题画面</button>
          </div>
        </div>
      </div>
      <div class="meters" aria-label="飞行仪表">
        <div class="meter"><div class="meter-label"><i data-icon="cross"></i>当前得分</div><output class="pixel score" id="score">000000</output></div>
        <div class="meter"><div class="meter-label"><i data-icon="cup"></i>最高纪录</div><output class="pixel" id="best">000000</output></div>
        <div class="meter"><div class="meter-label"><i data-icon="shield"></i>剩余机体</div><div class="hearts" id="lives" aria-label="剩余 3 架"></div></div>
        <div class="meter"><div class="meter-label"><i data-icon="bolt"></i>擦弹能量</div><div class="energy"><span class="cells" id="cells" aria-hidden="true"></span><output class="pixel" id="charge">0%</output></div></div>
      </div>
    </section>
    <section class="handbook" aria-labelledby="guideTitle">
      <h2 id="guideTitle"><i data-icon="book"></i>飞行手册</h2>
      <div class="guides">
        <div class="guide"><div class="guide-icon"><i data-icon="keyboard"></i></div><div><h3>键盘操控</h3><p><kbd>WASD</kbd> / <kbd>↑↓←→</kbd> 移动，<kbd>P</kbd> 暂停</p></div></div>
        <div class="guide"><div class="guide-icon"><i data-icon="touch"></i></div><div><h3>触屏操控</h3><p>单指拖动飞机，松手悬停</p></div></div>
        <div class="guide"><div class="guide-icon gold"><i data-icon="bolt"></i></div><div><h3>擦弹充能</h3><p>贴近子弹蓄能，满格后击落敌机触发闪电</p></div></div>
      </div>
    </section>
  </main>
</body>
</html>
